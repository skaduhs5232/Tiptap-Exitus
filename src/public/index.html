<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exitus Editor</title>
  <script src="./exituseditor.js"></script>
</head>

<body>
  <div class="editor-shell">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;

      }

      .container {
        display: flex;
        width: 100%;
        height: 100vh;
        /* Full height of the viewport */
      }

      .column {
        flex: 1;
        /* Equal width columns */
        padding: 20px;
      }
    </style>
    <div class="container">
      <div class="column">
        <button onclick="addColarQuestao('instrucao')">instrucao</button>
        <button onclick="addColarQuestao('comando')">comando</button>
        <button onclick="getColar()">Get colar</button>
        <div class="element"></div>
        <div class="element2" style="margin-top: 10px;"></div>
      </div>
      <div class="column">
        <div class="html-content editor-main">
          <div class="tiptap ProseMirror" id="testeHtml"></div>
        </div>
      </div>
    </div>

    <script>
      let defaultText =`<p style="margin-left: 0px!important;">Texto da tirinha.</p><p style="margin-left: 0px!important;"><figure style="width: 700px" class="ex-image-wrapper tiptap-widget ex-image-block-middle"><img src="https://images.unsplash.com/photo-1765707886460-3059e2fec28f?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" style="display: table-cell"></figure></p><p style="margin-left: 0px!important;">Limite.</p>`

      let content = ''

      if(localStorage.getItem('exitus-editor-content')) {
        content = localStorage.getItem('exitus-editor-content')
      } else {
        content = defaultText
        localStorage.setItem('exitus-editor-content', defaultText)
      }

    const exitusEditor = new ExitusEditor({
        container: document.querySelector('.element'),
        content: defaultText,
        config: {
          mathtype: {
            mathTypeParameters: {
              editorParameters: {
                fontFamily: "Arial",
                fontStyle: "normal",
                fontSize: "14px",
                fonts: [{
                  'id': 'inherit',
                  'label': 'Arial'
                }],
                language: "pt_br"
              }
            },
          },
          image: {
            //proxyUrl: "https://us-central1-desenvolvimento-271520.cloudfunctions.net/imagem-conversao-base64/proxy",
            allowBase64: true,
            imgColorida: true,
            inline: true
          },
          initialHeight: 400
        }
      })

      const exitusEditor2 = new ExitusEditor({
        container: document.querySelector('.element2'),
        editable: true,
        content: '<colar-questao title="comando">$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$</colar-questao>$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$$$\frac{a}{b} + c$$',
      })

      exitusEditor.on('create', ({ editor }) => {
        const htmlContent = document.querySelector('#testeHtml')
        htmlContent.innerHTML = editor.getHTML()
      })

      exitusEditor.on('update', ({ editor }) => {
        const htmlContent = document.querySelector('#testeHtml')

        const latexMatches = (editor.getHTML())

        localStorage.setItem('exitus-editor-content', editor.getHTML())

        htmlContent.innerHTML = latexMatches
      })

      window.editor = exitusEditor
      window.editor2 = exitusEditor2

      function addColarQuestao(title) {
        window.editor.commands.addColarQuestao(title)
      }

      function getColar() {
        console.log(window.editor.getPluginInstance('colarQuestao').getColarQuestao());
      }
    </script>
</body>

</html>
